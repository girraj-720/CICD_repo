name: Terraform CI

on:
  push:
    branches:
      - "**"

jobs:

  # ==========================================================
  # STAGE 1 - SECURITY & QUALITY
  # ==========================================================
  security-quality:
    name: Stage 1 - Security & Quality
    runs-on: self-hosted

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ======================================================
      # GITLEAKS
      # ======================================================
      - name: Gitleaks
        shell: powershell
        run: |
          gitleaks detect --no-git --source . --report-format json --report-path report.json

      # ======================================================
      # TFLINT
      # ======================================================
      - name: TFLint
        shell: powershell
        run: |
          tflint --recursive --format compact

          if ($LASTEXITCODE -ne 0) {
            Write-Host "TFLint found issues, but continuing pipeline..."
            exit 0
          }

      # ======================================================
      # INFRACOST
      # ======================================================
      - name: Infracost
        shell: powershell
        run: |
          infracost breakdown --path Enviroment/Dev --format json --out-file infracost-report.json
          infracost output --path infracost-report.json --format table

      # ======================================================
      # TFSEC
      # ======================================================
      - name: tfsec
        shell: powershell
        run: |
          tfsec Enviroment/Dev --format lovely,json --out tfsec-report
          tfsec Enviroment/Dev --format json --out tfsec-report.json


  # ==========================================================
  # STAGE 2 - AZURE LOGIN + TERRAFORM
  # ==========================================================
  terraform:
    name: Stage 2 - Azure Login & Terraform
    runs-on: self-hosted

    needs: security-quality

    defaults:
      run:
        shell: powershell
        working-directory: Enviroment/Dev/Child_module/Resource_group

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ======================================================
      # AZURE LOGIN - SERVICE PRINCIPAL
      # ======================================================
      - name: Azure Login
        shell: powershell
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal `
            --username "$env:AZURE_CLIENT_ID" `
            --password "$env:AZURE_CLIENT_SECRET" `
            --tenant "$env:AZURE_TENANT_ID"

          az account set --subscription "$env:AZURE_SUBSCRIPTION_ID"

          az account show

      # ======================================================
      # TERRAFORM INIT
      # ======================================================
      - name: Terraform Init
        run: |
          terraform init

      # ======================================================
      # TERRAFORM VALIDATE
      # ======================================================
      - name: Terraform Validate
        run: |
          terraform validate

      # ======================================================
      # TERRAFORM PLAN
      # ======================================================
      - name: Terraform Plan
        run: |
          terraform plan
      # ======================================================
      # TERRAFORM APPLY
      # ======================================================
      - name: Terraform apply -auto-approve
        run: |
          terraform plan
