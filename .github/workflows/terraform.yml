
name: Terraform CI

on:
  push:
    branches:
      - "**"

jobs:

  # ==========================================================
  # STAGE 1 - SECURITY & QUALITY
  # ==========================================================
  security-quality:
    name: Stage 1 - Security & Quality
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------- Gitleaks ----------------
      - name: Gitleaks
        shell: powershell
        run: |
          gitleaks detect --no-git --source . --report-format json --report-path report.json

      # ---------------- TFLint ----------------
      - name: TFLint
        shell: powershell
        run: |
          tflint --recursive --format compact

      # ---------------- Infracost ----------------
      - name: Infracost
        shell: powershell
        run: |
          infracost breakdown --path Enviroment/Dev --format json --out-file infracost-report.json
          infracost output --path infracost-report.json --format table

      # ---------------- tfsec ----------------
      - name: tfsec
        shell: powershell
        run: |
          tfsec Enviroment/Dev --format lovely,json --out tfsec-report
          tfsec Enviroment/Dev --format json --out tfsec-report.json


  # ==========================================================
  # STAGE 2 - AZURE LOGIN + TERRAFORM
  # ==========================================================
  terraform:
    name: Stage 2 - Azure Login & Terraform
    runs-on: self-hosted
    needs: security-quality

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        shell: powershell
        working-directory: Enviroment/Dev/Child_module/Resource_group

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------- Azure Login ----------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ---------------- Terraform Init ----------------
      - name: Terraform Init
        run: |
          terraform init

      # ---------------- Terraform Validate ----------------
      - name: Terraform Validate
        run: |
          terraform validate

      # ---------------- Terraform Plan ----------------
      - name: Terraform Plan
        run: |
          terraform plan
